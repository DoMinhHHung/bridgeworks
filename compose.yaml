name: ${COMPOSE_PROJECT_NAME:-bridgeworks}

services:
  apisix:
    image: apache/apisix:3.17.0-debian
    restart: unless-stopped
    depends_on:
      identity-service:
        condition: service_healthy
    ports:
      - "${APISIX_HTTP_PORT:-9080}:9080"
    volumes:
      - ./gateway/apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix/conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - bridgeworks

  identity-service:
    build:
      context: ./services/identity
      dockerfile: Dockerfile
      args:
        GO_VERSION: "1.26.5"
    restart: unless-stopped
    environment:
      SERVICE_NAME: identity-service
      HTTP_ADDR: ":8080"
      HTTP_READ_HEADER_TIMEOUT: 5s
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s
      SHUTDOWN_TIMEOUT: 10s
      LOG_LEVEL: info
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/health/ready
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bridgeworks

networks:
  bridgeworks:
    driver: bridge
