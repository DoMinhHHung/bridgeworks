name: ${COMPOSE_PROJECT_NAME:-bridgeworks}

services:
  apisix:
    image: apache/apisix:3.17.0-debian
    restart: unless-stopped
    environment:
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}
    ports:
      - "${APISIX_HTTP_PORT:-9080}:9080"
    volumes:
      - ./gateway/apisix/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./gateway/apisix/conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks: [bridgeworks]

  identity-postgres:
    image: postgres:17.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IDENTITY_POSTGRES_DB:?IDENTITY_POSTGRES_DB is required}
      POSTGRES_USER: ${IDENTITY_POSTGRES_USER:?IDENTITY_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${IDENTITY_POSTGRES_PASSWORD:?IDENTITY_POSTGRES_PASSWORD is required}
    volumes: [identity-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [bridgeworks]

  identity-redis:
    image: redis:8.2.8-alpine3.22
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly no
        --save ""
        --maxmemory 64mb
        --maxmemory-policy allkeys-lru
        --requirepass "$${REDIS_PASSWORD}"
    expose: ["6379"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -n "$${REDIS_PASSWORD}" &&
          redis-cli --no-auth-warning -h 127.0.0.1 -p 6379 -a "$${REDIS_PASSWORD}" ping 2>/dev/null |
          grep -qx PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks: [bridgeworks]

  identity-migrate:
    image: bridgeworks-identity-service:local
    build:
      context: ./service/identity-service
      dockerfile: Dockerfile
      args: { GO_VERSION: "1.26.5" }
    restart: "no"
    entrypoint: [/usr/local/bin/identity-migrate]
    command: [up]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?MIGRATION_DATABASE_URL is required}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-1m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      identity-postgres: { condition: service_healthy }
    networks: [bridgeworks]

  identity-service:
    image: bridgeworks-identity-service:local
    build:
      context: ./service/identity-service
      dockerfile: Dockerfile
      args: { GO_VERSION: "1.26.5" }
    restart: unless-stopped
    environment:
      SERVICE_NAME: identity-service
      HTTP_ADDR: :8080
      METRICS_ADDR: ${METRICS_ADDR:-:9090}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5s}
      DATABASE_READINESS_TIMEOUT: ${DATABASE_READINESS_TIMEOUT:-2s}
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-5}
      DATABASE_MIN_CONNS: ${DATABASE_MIN_CONNS:-0}
      DATABASE_MAX_CONN_LIFETIME: ${DATABASE_MAX_CONN_LIFETIME:-30m}
      DATABASE_MAX_CONN_IDLE_TIME: ${DATABASE_MAX_CONN_IDLE_TIME:-5m}
      DATABASE_HEALTH_CHECK_PERIOD: ${DATABASE_HEALTH_CHECK_PERIOD:-1m}
      REDIS_ADDR: ${REDIS_ADDR:?REDIS_ADDR is required}
      REDIS_USERNAME: ${REDIS_USERNAME:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # Local Compose Redis is plaintext on the private Docker network.
      # Production Upstash deployments must explicitly set this to true.
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_DIAL_TIMEOUT: ${REDIS_DIAL_TIMEOUT:-500ms}
      REDIS_OPERATION_TIMEOUT: ${REDIS_OPERATION_TIMEOUT:-150ms}
      CURRENT_USER_CACHE_TTL: ${CURRENT_USER_CACHE_TTL:-30s}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:?CLERK_WEBHOOK_SIGNING_SECRET is required}
      CLERK_WEBHOOK_PROCESS_TIMEOUT: ${CLERK_WEBHOOK_PROCESS_TIMEOUT:-5s}
      CLERK_WEBHOOK_MAX_BODY_BYTES: ${CLERK_WEBHOOK_MAX_BODY_BYTES:-1048576}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?CLERK_JWT_KEY is required}
      CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}
      CLERK_AUTH_LEEWAY: ${CLERK_AUTH_LEEWAY:-5s}
    expose: ["8080", "9090"]
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health/ready]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [bridgeworks]

  organization-postgres:
    image: postgres:17.10-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ORGANIZATION_POSTGRES_DB:?ORGANIZATION_POSTGRES_DB is required}
      POSTGRES_USER: ${ORGANIZATION_POSTGRES_USER:?ORGANIZATION_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${ORGANIZATION_POSTGRES_PASSWORD:?ORGANIZATION_POSTGRES_PASSWORD is required}
    volumes: [organization-postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [bridgeworks]

  organization-migrate:
    image: bridgeworks-organization-service:local
    build:
      context: ./service/organization-service
      dockerfile: Dockerfile
      args: { GO_VERSION: "1.26.5" }
    restart: "no"
    entrypoint: [/usr/local/bin/organization-migrate]
    command: [up]
    environment:
      MIGRATION_DATABASE_URL: ${ORGANIZATION_MIGRATION_DATABASE_URL:?ORGANIZATION_MIGRATION_DATABASE_URL is required}
      MIGRATION_TIMEOUT: ${ORGANIZATION_MIGRATION_TIMEOUT:-1m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      organization-postgres: { condition: service_healthy }
    networks: [bridgeworks]

  organization-service:
    image: bridgeworks-organization-service:local
    build:
      context: ./service/organization-service
      dockerfile: Dockerfile
      args: { GO_VERSION: "1.26.5" }
    restart: unless-stopped
    environment:
      SERVICE_NAME: organization-service
      HTTP_ADDR: :8080
      ORGANIZATION_METRICS_ADDR: ${ORGANIZATION_METRICS_ADDR:-:9090}
      HTTP_READ_HEADER_TIMEOUT: ${ORGANIZATION_HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_READ_TIMEOUT: ${ORGANIZATION_HTTP_READ_TIMEOUT:-15s}
      HTTP_WRITE_TIMEOUT: ${ORGANIZATION_HTTP_WRITE_TIMEOUT:-15s}
      HTTP_IDLE_TIMEOUT: ${ORGANIZATION_HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${ORGANIZATION_HTTP_SHUTDOWN_TIMEOUT:-10s}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${ORGANIZATION_DATABASE_URL:?ORGANIZATION_DATABASE_URL is required}
      DATABASE_CONNECT_TIMEOUT: ${ORGANIZATION_DATABASE_CONNECT_TIMEOUT:-5s}
      DATABASE_READINESS_TIMEOUT: ${ORGANIZATION_DATABASE_READINESS_TIMEOUT:-2s}
      DATABASE_MAX_CONNS: ${ORGANIZATION_DATABASE_MAX_CONNS:-5}
      DATABASE_MIN_CONNS: ${ORGANIZATION_DATABASE_MIN_CONNS:-0}
      DATABASE_MAX_CONN_LIFETIME: ${ORGANIZATION_DATABASE_MAX_CONN_LIFETIME:-30m}
      DATABASE_MAX_CONN_IDLE_TIME: ${ORGANIZATION_DATABASE_MAX_CONN_IDLE_TIME:-5m}
      DATABASE_HEALTH_CHECK_PERIOD: ${ORGANIZATION_DATABASE_HEALTH_CHECK_PERIOD:-1m}
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:?CLERK_JWT_KEY is required}
      CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}
      CLERK_AUTH_LEEWAY: ${CLERK_AUTH_LEEWAY:-5s}
      CLERK_ORGANIZATION_WEBHOOK_SIGNING_SECRET: ${CLERK_ORGANIZATION_WEBHOOK_SIGNING_SECRET:?CLERK_ORGANIZATION_WEBHOOK_SIGNING_SECRET is required}
      CLERK_ORGANIZATION_WEBHOOK_PROCESS_TIMEOUT: ${CLERK_ORGANIZATION_WEBHOOK_PROCESS_TIMEOUT:-5s}
      CLERK_ORGANIZATION_WEBHOOK_MAX_BODY_BYTES: ${CLERK_ORGANIZATION_WEBHOOK_MAX_BODY_BYTES:-1048576}
      IDENTITY_SERVICE_URL: ${IDENTITY_SERVICE_URL:-http://identity-service:8080}
      IDENTITY_SERVICE_REQUEST_TIMEOUT: ${IDENTITY_SERVICE_REQUEST_TIMEOUT:-2s}
    expose: ["8080", "9090"]
    depends_on:
      organization-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health/ready]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [bridgeworks]

networks:
  bridgeworks: { driver: bridge }
volumes:
  identity-postgres-data:
  organization-postgres-data:
