version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: sqlcgen
        out: internal/store/sqlcgen
        sql_package: pgx/v5
        emit_interface: false
        emit_json_tags: false
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
