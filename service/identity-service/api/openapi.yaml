openapi: 3.1.0
info:
  title: BridgeWorks Identity Service
  version: 0.1.0
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      responses:
        "200":
          description: The process is alive
          headers:
            X-Request-Id:
              description: Request correlation identifier
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Report whether the service is ready to receive traffic
      responses:
        "200":
          description: The service is ready
          headers:
            X-Request-Id:
              description: Request correlation identifier
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          example: identity-service
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
