openapi: 3.1.0
info:
  title: BridgeWorks Identity Service API
  version: 0.2.0
  description: Runtime health endpoints exposed through APISIX.
paths:
  /api/v1/identity/health/live:
    get:
      operationId: getIdentityLiveness
      summary: Check whether the identity process and HTTP stack are alive
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/identity/health/ready:
    get:
      operationId: getIdentityReadiness
      summary: Check whether PostgreSQL is reachable
      responses:
        "200":
          description: Service and PostgreSQL dependency are ready
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: PostgreSQL is unavailable or the readiness check timed out
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                notReady:
                  value:
                    code: service_unavailable
                    message: service is not ready
                    request_id: postgres-ready-check
                    details: null
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  headers:
    RequestID:
      description: Request correlation identifier generated or forwarded by APISIX.
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Request failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: identity-service
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
        - details
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details: {}
