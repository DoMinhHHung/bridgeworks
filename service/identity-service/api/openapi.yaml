openapi: 3.1.0
info:
  title: BridgeWorks Identity Service API
  version: 0.4.0
  description: Identity health, Clerk webhook synchronization, and authenticated current-user projection exposed through APISIX.
paths:
  /api/v1/me:
    get:
      operationId: getCurrentIdentityUser
      summary: Return the authenticated BridgeWorks identity projection
      description: Requires an Authorization header containing a valid Clerk session token as a Bearer credential. Clerk proves identity; Identity Service enforces the local account lifecycle.
      security:
        - ClerkSessionToken: []
      responses:
        "200":
          description: Active local identity projection
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Bearer token is missing or invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                unauthorized:
                  value:
                    code: unauthorized
                    message: authentication required
                    request_id: current-user-request-id
                    details: null
        "403":
          description: Local BridgeWorks account is disabled or deleted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                disabled:
                  value:
                    code: account_disabled
                    message: account is disabled
                    request_id: current-user-request-id
                    details: null
                deleted:
                  value:
                    code: account_deleted
                    message: account is deleted
                    request_id: current-user-request-id
                    details: null
        "409":
          description: Clerk identity is valid but the local webhook projection has not arrived yet
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
            Retry-After:
              description: Suggested delay in seconds before retrying the current-user request.
              schema:
                type: integer
                const: 2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                identityNotReady:
                  value:
                    code: identity_not_ready
                    message: identity synchronization is not complete
                    request_id: current-user-request-id
                    details: null
        "503":
          description: PostgreSQL is unavailable or the local lookup timed out
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                dependencyUnavailable:
                  value:
                    code: service_unavailable
                    message: service temporarily unavailable
                    request_id: current-user-request-id
                    details: null
  /api/v1/identity/health/live:
    get:
      operationId: getIdentityLiveness
      summary: Check whether the identity process and HTTP stack are alive
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/identity/health/ready:
    get:
      operationId: getIdentityReadiness
      summary: Check whether PostgreSQL is reachable
      responses:
        "200":
          description: Service and PostgreSQL dependency are ready
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: PostgreSQL is unavailable or the readiness check timed out
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/identity/webhooks/clerk:
    post:
      operationId: synchronizeClerkUserWebhook
      summary: Synchronize a verified Clerk user webhook into the local identity projection
      description: Public signed Clerk/Svix webhook endpoint. The request body is verified as raw bytes before JSON decoding.
      responses:
        "204":
          description: Event processed, duplicated, stale, or unsupported
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
        "400":
          description: Signature, required Svix headers, timestamp, or payload is invalid
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              examples:
                invalidWebhook:
                  value:
                    code: invalid_webhook
                    message: invalid webhook request
                    request_id: webhook-request-id
                    details: null
        "413":
          description: Request body exceeds the configured maximum
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: PostgreSQL is unavailable or processing timed out; Clerk should retry
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  securitySchemes:
    ClerkSessionToken:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Clerk session JWT passed in the Authorization header. Verification key and claim internals are not part of the public API contract.
  headers:
    RequestID:
      description: Request correlation identifier generated or forwarded by APISIX.
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Request failed
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestID"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, id_user, primary_email, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Stable UUIDv7 generated by Identity Service.
        id_user:
          type: string
          pattern: "^bw[0-9]{12}$"
          description: Public BridgeWorks user identifier.
        primary_email:
          type: [string, "null"]
          format: email
          description: Verified Clerk primary-email projection when available.
        status:
          type: string
          const: active
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: identity-service
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details: {}
