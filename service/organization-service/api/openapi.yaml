openapi: 3.1.0
info:
  title: BridgeWorks Organization Service API
  version: 0.3.0
  description: Organization synchronization, Clerk-owned creation projection, BridgeWorks onboarding product profile, local membership authorization, and current-organization commands exposed through APISIX.
paths:
  /api/v1/organizations/health/live:
    get:
      summary: Check Organization Service process liveness
      operationId: getOrganizationLiveness
      responses:
        "200":
          description: Process is alive
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /api/v1/organizations/health/ready:
    get:
      summary: Check Organization PostgreSQL readiness
      operationId: getOrganizationReadiness
      description: Identity Service is intentionally excluded because it is a request-time dependency only.
      responses:
        "200":
          description: Organization PostgreSQL is reachable
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/organizations/webhooks/clerk:
    post:
      summary: Synchronize verified Clerk organization events
      operationId: synchronizeClerkOrganizationWebhook
      description: Public Svix-signed endpoint. Signature verification occurs on the raw body before narrow decoding. Clerk remains authoritative for provider organization identity, name/slug, creator identity, and memberships. BridgeWorks product profile, verification, trust, application roles, and permissions remain locally authoritative.
      responses:
        "204":
          description: Supported event processed, duplicate or stale event retained, or verified unsupported event ignored
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
        "400": { $ref: "#/components/responses/InvalidWebhook" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/organizations/current:
    options:
      summary: Browser CORS preflight
      responses:
        "204": { description: Preflight accepted for a configured origin }
    get:
      summary: Return the active local organization projection
      operationId: getCurrentOrganization
      description: If Clerk has created the active organization but its verified webhook projection has not arrived yet, the API returns organization_not_ready with Retry-After rather than creating a local row from client input.
      security: [{ ClerkSessionToken: [] }]
      responses:
        "200":
          description: Current active organization including BridgeWorks-owned product profile and lifecycle projections
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Vary: { $ref: "#/components/headers/VaryAuthorization" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentOrganization" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailableAuthenticated" }
    patch:
      summary: Update BridgeWorks-owned onboarding product profile
      operationId: patchCurrentOrganization
      description: Mutates only legal_name, website, country, and company_type for the verified active organization. Tenant identity comes only from the verified Clerk session plus local membership resolution. Provider fields, verification/trust states, application roles, and permissions cannot be supplied here. Requires local organization.manage.
      security: [{ ClerkSessionToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationProfilePatch" }
      responses:
        "200":
          description: Updated normalized organization projection. Repeating an equivalent normalized patch is idempotent.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Vary: { $ref: "#/components/headers/VaryAuthorization" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentOrganization" }
        "400": { $ref: "#/components/responses/InvalidRequestAuthenticated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/RequestTooLargeAuthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailableAuthenticated" }
  /api/v1/organizations/current/verification:
    options:
      summary: Browser CORS preflight
      responses:
        "204": { description: Preflight accepted for a configured origin }
    post:
      summary: Request BridgeWorks company verification
      operationId: requestCurrentOrganizationVerification
      description: Customer-side request only. Atomically transitions unverified or rejected to pending; pending is an idempotent success. It never approves or rejects a company. Requires local organization.verify.request.
      security: [{ ClerkSessionToken: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Current organization with verification_status pending
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Vary: { $ref: "#/components/headers/VaryAuthorization" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentOrganization" }
        "400": { $ref: "#/components/responses/InvalidRequestAuthenticated" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/VerificationConflict" }
        "413": { $ref: "#/components/responses/RequestTooLargeAuthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailableAuthenticated" }
  /api/v1/organizations/current/membership:
    options:
      summary: Browser CORS preflight
      responses:
        "204": { description: Preflight accepted for a configured origin }
    get:
      summary: Return the actor's local membership authorization projection
      operationId: getCurrentOrganizationMembership
      security: [{ ClerkSessionToken: [] }]
      responses:
        "200":
          description: Current active membership and local effective permissions
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestID" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Vary: { $ref: "#/components/headers/VaryAuthorization" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailableAuthenticated" }
components:
  securitySchemes:
    ClerkSessionToken:
      type: http
      scheme: bearer
      bearerFormat: Clerk session token
      description: Verified Clerk session JWT with an active organization context. JWT organization role and permissions are not authorization authority.
  headers:
    RequestID:
      description: Request correlation identifier generated or forwarded by APISIX.
      schema: { type: string }
    NoStore:
      description: Authenticated projections must not be cached.
      schema: { type: string, const: no-store }
    VaryAuthorization:
      description: Contains Authorization and may also contain Origin.
      schema: { type: string }
    BearerChallenge:
      description: Stable Bearer authentication challenge without token-validation details.
      schema: { type: string, const: 'Bearer realm="bridgeworks"' }
    RetryAfter:
      description: Suggested retry delay in seconds for eventual-consistency lag.
      schema: { type: integer, const: 2 }
  responses:
    Unauthorized:
      description: Clerk session token is missing or invalid
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
        WWW-Authenticate: { $ref: "#/components/headers/BearerChallenge" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Account, organization, membership, or local permission denies access
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Active organization context or an eventually consistent local projection is not ready
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    VerificationConflict:
      description: Verification is already verified or otherwise cannot be requested from its current BridgeWorks lifecycle state. Eventual-consistency conflicts still use organization_not_ready and Retry-After.
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidRequestAuthenticated:
      description: Malformed, unknown, empty, or invalid onboarding input
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InvalidWebhook:
      description: Signature, required Svix header, or verified payload is invalid
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RequestTooLarge:
      description: Webhook body exceeds the configured maximum
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RequestTooLargeAuthenticated:
      description: Onboarding request body exceeds the bounded command limit
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailable:
      description: Organization PostgreSQL or webhook processing is temporarily unavailable
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ServiceUnavailableAuthenticated:
      description: Organization PostgreSQL or Identity Service is temporarily unavailable
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestID" }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Vary: { $ref: "#/components/headers/VaryAuthorization" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: organization-service }
    OrganizationProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        legal_name:
          type: [string, "null"]
          maxLength: 200
          description: Trimmed legal company name. Null clears the field; a non-null blank value is invalid.
        website:
          type: [string, "null"]
          maxLength: 2048
          description: Absolute HTTP or HTTPS URL. Credentials and fragments are rejected; scheme/host/default port are normalized. Null clears the field.
        country:
          type: [string, "null"]
          pattern: '^[A-Za-z]{2}$'
          description: ISO 3166-1 alpha-2 code, normalized to uppercase. Null clears the field.
        company_type:
          type: [string, "null"]
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*[A-Za-z0-9]$|^[A-Za-z0-9]$'
          description: Taxonomy-neutral bounded identifier normalized to lowercase. The product taxonomy is intentionally not frozen in this PR. Null clears the field.
    CurrentOrganization:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - status
        - legal_name
        - website
        - country
        - company_type
        - verification_status
        - trust_status
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        slug: { type: [string, "null"] }
        status:
          type: string
          const: active
          description: Provider/application lifecycle. This is separate from verification_status and trust_status.
        legal_name: { type: [string, "null"] }
        website: { type: [string, "null"] }
        country: { type: [string, "null"] }
        company_type: { type: [string, "null"] }
        verification_status:
          type: string
          enum: [unverified, pending, verified, rejected]
          description: BridgeWorks company-verification lifecycle. Client profile PATCH cannot set this field directly.
        trust_status:
          type: string
          const: unassessed
          description: BridgeWorks trust lifecycle placeholder. Client onboarding commands cannot mutate it.
    CurrentMembership:
      type: object
      additionalProperties: false
      required: [id, organization_id, role, permissions]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        role:
          type: string
          enum: [owner, admin, recruiter, delivery_manager, viewer]
          description: BridgeWorks local application role; Clerk role claims are not authorization authority.
        permissions:
          type: array
          items: { type: string }
          description: Lexicographically sorted local effective permissions.
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, request_id, details]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        details: {}