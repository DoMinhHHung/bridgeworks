name: Observability CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-normalization:
    name: Apply deterministic observability normalization
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 8
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Normalize modules and append documentation
        shell: bash
        run: |
          set -euo pipefail
          for module in service/identity-service service/organization-service; do
            find "${module}" -name '*.go' -type f -print0 | xargs -0 -r gofmt -w
            (cd "${module}" && go mod tidy)
          done

          append_section() {
            local target="$1" snippet="$2" marker="$3"
            if ! grep --quiet --fixed-strings "${marker}" "${target}"; then
              printf '\n---\n\n' >> "${target}"
              cat "${snippet}" >> "${target}"
            fi
          }
          append_section README.md .github/observability-docs/root.md '## Production Observability Foundation'
          append_section service/identity-service/README.md .github/observability-docs/identity.md '## Private metrics and access logs'
          append_section service/organization-service/README.md .github/observability-docs/organization.md '## Private metrics and access logs'
          rm -rf .github/observability-docs

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md service/identity-service service/organization-service .github/observability-docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: normalize observability modules and docs'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  validation:
    name: Observability repository and Go validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Configure local environment
        run: cp .env.example .env

      - name: Verify repository and generated sqlc sources
        run: |
          make repo-check
          make identity-sqlc-check
          make organization-sqlc-check

      - name: Verify locked migrations
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- \
            service/identity-service/migrations/000001_create_app_users.sql
          git diff --exit-code origin/main...HEAD -- \
            service/organization-service/migrations/000001_create_organization_foundation.sql
          test "$(find service/identity-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "1"
          test "$(find service/organization-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "1"

      - name: Verify private observability topology
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          grep --quiet 'METRICS_ADDR' compose.yaml
          grep --quiet 'ORGANIZATION_METRICS_ADDR' compose.yaml
          grep --quiet 'expose: \["8080", "9090"\]' compose.yaml
          ! grep -R --line-number --fixed-strings ':9090' gateway/apisix
          ! grep -R --line-number 'prometheus.Default' service/identity-service service/organization-service
          ! grep -R --line-number 'promauto' service/identity-service service/organization-service

      - name: Validate Identity Go module
        shell: bash
        run: |
          set -euo pipefail
          cd service/identity-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Validate Organization Go module
        shell: bash
        run: |
          set -euo pipefail
          cd service/organization-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

  integration:
    name: Private metrics and structured access-log integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Configure environment and ephemeral Clerk key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          auth_work="${RUNNER_TEMP}/clerk-auth"
          mkdir -p "${auth_work}"
          (
            cd service/identity-service
            go run ../../.github/scripts/clerk-session-token.go \
              -action generate \
              -private-key "${auth_work}/private.pem" \
              -public-key "${auth_work}/public.key"
          )
          public_key="$(cat "${auth_work}/public.key")"
          test -n "${public_key}"
          sed -i "s|^CLERK_JWT_KEY=.*$|CLERK_JWT_KEY=${public_key}|" .env

      - name: Start complete private stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose down --remove-orphans --volumes
          make stack-up
          make gateway-smoke organization-smoke

      - name: Verify private observability
        shell: bash
        run: bash .github/scripts/verify-observability.sh

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service identity-postgres organization-service organization-postgres identity-migrate organization-migrate

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes
