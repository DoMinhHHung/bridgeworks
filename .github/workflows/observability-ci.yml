name: Observability CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Observability repository and Go validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Configure local environment
        run: cp .env.example .env

      - name: Verify repository and generated sqlc sources
        run: |
          make repo-check
          make identity-sqlc-check
          make organization-sqlc-check

      - name: Verify locked migrations
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- \
            service/identity-service/migrations/000001_create_app_users.sql \
            service/identity-service/migrations/000002_add_platform_access.sql \
            service/organization-service/migrations/000001_create_organization_foundation.sql \
            service/organization-service/migrations/000002_complete_organization_domain.sql \
            service/organization-service/migrations/000003_add_owner_bootstrap_state.sql \
            service/organization-service/migrations/000004_add_membership_administration.sql
          test "$(find service/identity-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "2"
          test "$(find service/organization-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "5"

      - name: Verify private observability topology and bounded contracts
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          test ! -e .github/workflows/observability-docs-correction.yml
          test ! -e .github/workflows/observability-integration-correction.yml
          grep --quiet 'METRICS_ADDR' compose.yaml
          grep --quiet 'ORGANIZATION_METRICS_ADDR' compose.yaml
          grep --quiet 'expose: \["8080", "9090"\]' compose.yaml
          ! grep -R --line-number --fixed-strings ':9090' gateway/apisix
          ! grep -R --line-number --fixed-strings '/__observability/custom-method' gateway/apisix
          ! grep --quiet --fixed-strings 'methods: [PURGE]' .github/scripts/verify-observability.sh
          grep --quiet --fixed-strings 'route_selected=true' .github/scripts/verify-observability.sh
          grep --quiet --fixed-strings 'custom_method_headers' .github/scripts/verify-observability.sh
          grep --quiet --fixed-strings 'test "${custom_method_status}" = "405"' .github/scripts/verify-observability.sh
          ! grep -R --line-number 'prometheus.Default' service/identity-service service/organization-service
          ! grep -R --line-number 'promauto' service/identity-service service/organization-service
          grep --quiet 'type ClerkWebhookOutcomeProcessor interface' service/identity-service/internal/httpapi/clerk_webhook.go
          grep --quiet 'type EventOutcomeProcessor interface' service/organization-service/internal/httpapi/clerk_webhook.go
          ! grep --quiet --fixed-strings 'processor.(clerkWebhookOutcomeProcessor)' service/identity-service/internal/httpapi/clerk_webhook.go
          ! grep --quiet --fixed-strings 'processor.(eventOutcomeProcessor)' service/organization-service/internal/httpapi/clerk_webhook.go
          grep --quiet 'normalizeHTTPMethod' service/identity-service/internal/observability/metrics.go
          grep --quiet 'normalizeHTTPMethod' service/organization-service/internal/observability/metrics.go
          ! grep --quiet 'AggregateOrganization' service/identity-service/internal/observability/metrics.go
          ! grep --quiet 'AggregateUser' service/organization-service/internal/observability/metrics.go
          ! grep -R --line-number --fixed-strings 'defer func() { _ = recover() }()' \
            service/identity-service/internal/observability \
            service/organization-service/internal/observability

      - name: Validate Identity Go module
        shell: bash
        run: |
          set -euo pipefail
          cd service/identity-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Validate Organization Go module
        shell: bash
        run: |
          set -euo pipefail
          cd service/organization-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

  integration:
    name: Private metrics and structured access-log integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Configure environment and ephemeral Clerk key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          auth_work="${RUNNER_TEMP}/clerk-auth"
          mkdir -p "${auth_work}"
          (
            cd service/identity-service
            go run ../../.github/scripts/clerk-session-token.go \
              -action generate \
              -private-key "${auth_work}/private.pem" \
              -public-key "${auth_work}/public.key"
          )
          public_key="$(cat "${auth_work}/public.key")"
          test -n "${public_key}"
          sed -i "s|^CLERK_JWT_KEY=.*$|CLERK_JWT_KEY=${public_key}|" .env

      - name: Start complete private stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose down --remove-orphans --volumes
          make stack-up
          make gateway-smoke organization-smoke

      - name: Verify private observability
        shell: bash
        run: bash .github/scripts/verify-observability.sh

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service identity-postgres organization-service organization-postgres identity-migrate organization-migrate

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes