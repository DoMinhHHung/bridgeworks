name: Observability integration correction

on:
  push:
    branches:
      - feat/production-observability-foundation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-observability-foundation
          fetch-depth: 0

      - name: Use an APISIX-supported extension method and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/verify-observability.sh')
          text = script.read_text()
          text = text.replace(
              '# Add an ephemeral CI-only APISIX route without a method filter so a\n# non-standard HTTP token reaches the real Identity listener. The committed\n# public route contract remains unchanged and cleanup restores the file.',
              '# Add an ephemeral CI-only APISIX route for the APISIX-supported PURGE\n# extension method. PURGE is intentionally outside the service metric allowlist,\n# so it must collapse to OTHER while the access log retains the raw method. The\n# committed public route contract remains unchanged and cleanup restores the file.'
          )
          text = text.replace(
              '    uri: /__observability/custom-method\n    plugins:',
              '    uri: /__observability/custom-method\n    methods: [PURGE]\n    plugins:'
          )
          text = text.replace('--request X-CUSTOM-123', '--request PURGE')
          text = text.replace("'X-CUSTOM-123' \"${identity_metrics}\"", "'PURGE' \"${identity_metrics}\"")
          text = text.replace('\"method\":\"X-CUSTOM-123\"', '\"method\":\"PURGE\"')
          script.write_text(text)

          for path in [
              Path('service/identity-service/internal/observability/metrics_test.go'),
              Path('service/organization-service/internal/observability/metrics_test.go'),
          ]:
              text = path.read_text()
              text = text.replace(
                  'arbitrary := []string{"X-CUSTOM-123", "BREW-456", "ATTACKER-METHOD"}',
                  'arbitrary := []string{"X-CUSTOM-123", "PURGE", "BREW-456", "ATTACKER-METHOD"}'
              )
              text = text.replace('status_class=\"4xx\"} 3', 'status_class=\"4xx\"} 4')
              path.write_text(text)
          PY
          gofmt -w service/identity-service/internal/observability/metrics_test.go
          gofmt -w service/organization-service/internal/observability/metrics_test.go
          git rm .github/workflows/observability-integration-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/verify-observability.sh \
            service/identity-service/internal/observability/metrics_test.go \
            service/organization-service/internal/observability/metrics_test.go
          git commit -m "test(observability): use APISIX-supported extension method"
          git push origin HEAD:feat/production-observability-foundation
