name: Observability integration correction

on:
  push:
    branches:
      - feat/production-observability-foundation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-observability-foundation
          fetch-depth: 0

      - name: Remove ephemeral route method filter and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/verify-observability.sh')
          text = path.read_text()
          needle = '    uri: /__observability/custom-method\n    methods: [PURGE]\n    plugins:'
          replacement = '    uri: /__observability/custom-method\n    plugins:'
          if needle not in text:
              raise SystemExit('PURGE route filter not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          git rm .github/workflows/observability-integration-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/verify-observability.sh
          git commit -m "test(observability): forward PURGE through APISIX"
          git push origin HEAD:feat/production-observability-foundation
