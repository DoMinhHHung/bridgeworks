name: Observability integration correction

on:
  push:
    branches:
      - feat/production-observability-foundation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-observability-foundation
          fetch-depth: 0

      - name: Correct CRLF-safe route proof and expected backend status
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/verify-observability.sh')
          text = path.read_text()
          old_regex = "'^X-Request-Id:[[:space:]]*obs-custom-method\\r?$'"
          new_regex = "'^X-Request-Id:[[:space:]]*obs-custom-method[[:space:]]*$'"
          if old_regex not in text:
              raise SystemExit('route selection header regex not found')
          text = text.replace(old_regex, new_regex, 1)
          old_status = 'test "${custom_method_status}" = "404"'
          new_status = 'test "${custom_method_status}" = "405"'
          if old_status not in text:
              raise SystemExit('custom method expected status not found')
          path.write_text(text.replace(old_status, new_status, 1))
          PY
          git rm .github/workflows/observability-integration-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/verify-observability.sh
          git commit -m "test(observability): accept routed PURGE method response"
          git push origin HEAD:feat/production-observability-foundation
