name: Observability integration correction

on:
  push:
    branches:
      - feat/production-observability-foundation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-observability-foundation
          fetch-depth: 0

      - name: Wait for route-specific response proof and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/verify-observability.sh')
          text = path.read_text()
          old = '''custom_method_status=''
          for _ in $(seq 1 30); do
            custom_method_status="$(curl --show-error --silent --output /dev/null --write-out '%{http_code}' \\
              --request PURGE -H 'X-Request-Id: obs-custom-method' \\
              "${base_url}/__observability/custom-method")"
            if [ "${custom_method_status}" = "404" ]; then
              break
            fi
            sleep 1
          done
          test "${custom_method_status}" = "404"
          '''
          new = '''custom_method_status=''
          custom_method_headers="${work}/custom-method.headers"
          route_selected=false
          for _ in $(seq 1 30); do
            : > "${custom_method_headers}"
            custom_method_status="$(curl --show-error --silent --output /dev/null \\
              --dump-header "${custom_method_headers}" --write-out '%{http_code}' \\
              --request PURGE -H 'X-Request-Id: obs-custom-method' \\
              "${base_url}/__observability/custom-method")"
            if grep --ignore-case --quiet --extended-regexp \\
              '^X-Request-Id:[[:space:]]*obs-custom-method\\r?$' "${custom_method_headers}"; then
              route_selected=true
              break
            fi
            sleep 1
          done
          test "${route_selected}" = "true"
          test "${custom_method_status}" = "404"
          '''
          if old not in text:
              raise SystemExit('custom method polling block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/observability-integration-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/verify-observability.sh
          git commit -m "test(observability): wait for APISIX route selection"
          git push origin HEAD:feat/production-observability-foundation
