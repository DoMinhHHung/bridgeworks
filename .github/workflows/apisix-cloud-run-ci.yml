name: APISIX Cloud Run CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apisix-cloud-run-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect APISIX Cloud Run validation scope
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect APISIX validation changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(bash .github/scripts/ci-base-sha.sh)"
          changed="$(git diff --name-only "${base_sha}...HEAD")"
          required=false
          while IFS= read -r path; do
            case "${path}" in
              gateway/apisix/*|\
              service/identity-service/internal/httpapi/platform_access.go|\
              .github/scripts/verify-platform-access.sh|\
              .github/scripts/ci-base-sha.sh|\
              .github/workflows/apisix-cloud-run-ci.yml|\
              Makefile)
                required=true
                break
                ;;
            esac
          done <<< "${changed}"
          printf 'required=%s\n' "${required}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Build and validate Cloud Run gateway
    if: needs.detect.outputs.required == 'true'
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify private Identity platform route is not published
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R --line-number --fixed-strings '/internal/v1/platform-access/me' \
            gateway/apisix/conf/apisix.yaml \
            gateway/apisix/conf/apisix.cloud-run.yaml

      - name: Validate APISIX Cloud Run image
        shell: bash
        run: bash gateway/apisix/scripts/validate-cloud-run-image.sh

  required:
    name: APISIX Cloud Run required
    if: always()
    needs: [detect, validate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce APISIX validation result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATION_REQUIRED: ${{ needs.detect.outputs.required }}
        run: |
          set -euo pipefail
          test "${DETECT_RESULT}" = "success"
          if [[ "${VALIDATION_REQUIRED}" == "true" ]]; then
            test "${VALIDATE_RESULT}" = "success"
          else
            test "${VALIDATE_RESULT}" = "skipped"
          fi
