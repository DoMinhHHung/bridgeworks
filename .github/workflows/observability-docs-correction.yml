name: Observability documentation correction

on:
  push:
    branches:
      - feat/production-observability-foundation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/production-observability-foundation
          fetch-depth: 0

      - name: Update observability documentation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          files = {
              Path("README.md"): """
          ## Observability correction guarantees

          Production webhook metrics now require outcome-capable application processors at compile time. The instrumented routes call `ProcessWithResult` directly; they do not type-assert, fall back to `Process`, or default an event to `processed`.

          HTTP metric method labels are restricted to `GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE|OTHER`. Access logs preserve the actual request method for diagnostics, while arbitrary methods collapse to `OTHER` in Prometheus. Identity accepts only the `user` webhook aggregate; Organization accepts only `organization` and `membership`.

          PostgreSQL pool collection remains scrape-time and nil-safe, but programming panics are not silently swallowed. Graceful shutdown stops the private metrics server before the application server and PostgreSQL pool. Health request completion records are logged only at debug level; with the normal info threshold they are intentionally absent.
          """,
              Path("service/identity-service/README.md"): """
          ### Correction-round telemetry guarantees

          The production Clerk webhook route depends on `ProcessWithResult(context.Context, clerkwebhook.Event) (usersync.Result, error)` at compile time. There is no runtime type assertion, fallback to `Process`, or default `processed` outcome. Identity webhook metrics accept only `aggregate=user`.

          HTTP metric method labels use the bounded values `GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE|OTHER`; arbitrary methods map to `OTHER`. Access logs retain the actual request method. Pool metrics are collected from `pgxpool.Stat()` at scrape time without database queries or silent panic recovery. Shutdown stops metrics serving before closing PostgreSQL. Health completion records are debug-only and are absent at the normal info log threshold.
          """,
              Path("service/organization-service/README.md"): """
          ### Correction-round telemetry guarantees

          The production Clerk webhook route depends on `ProcessWithResult(context.Context, organizationsync.Event) (organizationsync.Result, error)` at compile time. There is no runtime type assertion, fallback to `Process`, or default `processed` outcome. Organization webhook metrics accept only `aggregate=organization|membership`.

          HTTP metric method labels use the bounded values `GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE|OTHER`; arbitrary methods map to `OTHER`. Access logs retain the actual request method. Pool metrics are collected from `pgxpool.Stat()` at scrape time without database queries or silent panic recovery. Shutdown stops metrics serving before closing PostgreSQL. Health completion records are debug-only and are absent at the normal info log threshold.
          """,
              Path("docs/production-readiness-roadmap.md"): """
          ### Observability correction status

          The completed observability foundation enforces webhook outcomes through compile-time application interfaces, bounds arbitrary HTTP methods to the Prometheus label `OTHER`, validates service-specific webhook aggregate allowlists, and does not silently recover pool-collector programming panics. Private-listener isolation and shutdown ordering are covered by regression tests. Health access records remain debug-only and are normally absent when services run at info level.

          This does not complete load testing, pool sizing, rate limiting, Upstash Redis cache-aside, OpenTelemetry, or inbox retention.
          """,
          }

          old = "Health completion records use debug level."
          replacement = "Health completion records are written only at debug level; with the normal info threshold they are intentionally absent."
          marker = "Correction-round telemetry guarantees"
          for path, section in files.items():
              text = path.read_text()
              text = text.replace(old, replacement)
              section_marker = section.strip().splitlines()[0].lstrip("# ")
              if section_marker not in text:
                  text = text.rstrip() + "\n\n" + section.strip() + "\n"
              path.write_text(text)
          PY
          git rm .github/workflows/observability-docs-correction.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md service/identity-service/README.md service/organization-service/README.md docs/production-readiness-roadmap.md
          git commit -m "docs(observability): clarify bounded telemetry contracts"
          git push origin HEAD:feat/production-observability-foundation
