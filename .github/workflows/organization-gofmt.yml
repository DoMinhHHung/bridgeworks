name: Format Organization Go Sources

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-organization-go-sources
  cancel-in-progress: false

jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/organization-sync-authorization
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          find service/organization-service -name '*.go' -type f -print0 | xargs -0 -r gofmt -w
          (
            cd service/organization-service
            go mod tidy
          )
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service/organization-service
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(organization): format Go sources"
          git push origin HEAD:feat/organization-sync-authorization
