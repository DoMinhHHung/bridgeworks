name: Organization Format Diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gofmt-correction:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/organization-membership-administration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/organization-membership-administration
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply gofmt only
        shell: bash
        run: |
          set -euo pipefail
          cd service/organization-service
          find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -w
          cd ../..
          changed="$(git diff --name-only)"
          if [[ -z "${changed}" ]]; then
            echo "All Go files are formatted."
            exit 0
          fi
          if grep -v '^service/organization-service/.*\.go$' <<< "${changed}"; then
            echo "gofmt changed a file outside Organization Go sources" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service/organization-service
          git commit -m 'chore(organization): apply gofmt'
          git push origin HEAD:feat/organization-membership-administration
