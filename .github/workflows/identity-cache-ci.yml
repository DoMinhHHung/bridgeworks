name: Identity Current User Cache CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-current-user-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Identity cache repository and Go validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Configure local environment
        run: cp .env.example .env

      - name: Verify repository, generated SQL, and Compose
        shell: bash
        run: |
          set -euo pipefail
          make repo-check
          make identity-sqlc-check
          make organization-sqlc-check
          docker compose config --quiet

      - name: Verify locked scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code origin/main...HEAD -- \
            service/identity-service/migrations/000001_create_app_users.sql \
            service/organization-service/migrations/000001_create_organization_foundation.sql \
            gateway/apisix/conf/apisix.yaml \
            gateway/apisix/conf/config.yaml \
            service/identity-service/internal/store \
            service/identity-service/internal/httpapi
          test "$(find service/identity-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "1"
          test "$(find service/organization-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "2"
          grep --quiet 'DATABASE_MAX_CONNS=5' .env.example
          grep --quiet 'DATABASE_MIN_CONNS=0' .env.example
          grep --quiet 'ORGANIZATION_DATABASE_MAX_CONNS=5' .env.example
          grep --quiet 'ORGANIZATION_DATABASE_MIN_CONNS=0' .env.example
          ! grep -R --line-number --fixed-strings 'Ping(' service/identity-service/internal/rediscache
          ! grep -R --line-number --ignore-case 'redis' gateway/apisix
          ! grep -A4 '^    depends_on:' compose.yaml | grep --quiet 'identity-redis'

      - name: Validate Identity module under race detector
        shell: bash
        run: |
          set -euo pipefail
          cd service/identity-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

  integration:
    name: PostgreSQL, Redis, APISIX, and shared-cache integration
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Run real current-user cache scenarios
        shell: bash
        run: make identity-cache-integration

      - name: Print sanitized service state on failure
        if: failure()
        shell: bash
        run: |
          set +e
          docker compose ps
          docker compose logs --no-color apisix identity-service identity-postgres identity-redis

      - name: Deterministic cleanup
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_failed=0
          while IFS= read -r project; do
            [[ -z "${project}" ]] && continue
            docker compose -p "${project}" down --remove-orphans --volumes || cleanup_failed=1
          done < <(
            docker compose ls --format json | python3 -c \
              'import json,sys; print("\n".join(item["Name"] for item in json.load(sys.stdin) if item["Name"].startswith("bridgeworks-cache-")))'
          )
          remaining_containers="$(docker ps -aq --filter name=bridgeworks-cache-)"
          remaining_projects="$(docker compose ls --format json | python3 -c 'import json,sys; print("\n".join(item["Name"] for item in json.load(sys.stdin) if item["Name"].startswith("bridgeworks-cache-")))')"
          remaining_networks="$(docker network ls --format '{{.Name}}' | grep '^bridgeworks-cache-' || true)"
          remaining_volumes="$(docker volume ls --format '{{.Name}}' | grep '^bridgeworks-cache-' || true)"
          [[ -z "${remaining_containers}" ]] || cleanup_failed=1
          [[ -z "${remaining_projects}" ]] || cleanup_failed=1
          [[ -z "${remaining_networks}" ]] || cleanup_failed=1
          [[ -z "${remaining_volumes}" ]] || cleanup_failed=1
          rm -f .env
          exit "${cleanup_failed}"
