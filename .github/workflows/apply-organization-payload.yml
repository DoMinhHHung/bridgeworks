name: Apply Organization Source Payload

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: apply-organization-payload
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/organization-sync-authorization
          fetch-depth: 0
      - name: Decode, verify, and apply source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .github/payloads/organization/chunk-* | base64 --decode > /tmp/organization-source.tgz
          test "$(sha256sum /tmp/organization-source.tgz | awk '{print $1}')" = "e7b7ecec80880ffbd0bcfd0a0a5f2080f3c2dc5f6ae16d73816c647c8dd2078b"
          tar --extract --gzip --file /tmp/organization-source.tgz --directory .
          rm -rf .github/payloads/organization
          rm -f .github/workflows/apply-organization-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "feat(organization): add synchronization and authorization runtime"
          git push origin HEAD:feat/organization-sync-authorization
