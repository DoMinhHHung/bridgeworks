name: Organization Compile Diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  compile-diagnostic:
    if: github.event.pull_request.head.ref == 'feat/organization-membership-administration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/organization-membership-administration
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Persist compiler and test failures only
        shell: bash
        run: |
          set +e
          cd service/organization-service
          go vet ./... > /tmp/vet.log 2>&1
          vet_status=$?
          go test ./... > /tmp/test.log 2>&1
          test_status=$?
          {
            echo '--- filtered go vet ---'
            grep -E '(^# |\.go:[0-9]+:|undefined|does not implement|cannot use|too many arguments|not enough arguments|FAIL)' /tmp/vet.log | head -n 120 || true
            echo '--- filtered go test ---'
            grep -E '(^# |\.go:[0-9]+:|undefined|does not implement|cannot use|too many arguments|not enough arguments|--- FAIL:|FAIL)' /tmp/test.log | head -n 160 || true
            echo "vet_status=${vet_status}"
            echo "test_status=${test_status}"
          } > compile-diagnostic.txt
          cd ../..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service/organization-service/compile-diagnostic.txt
          git commit -m 'test(organization): record temporary compile diagnostics'
          git push origin HEAD:feat/organization-membership-administration
