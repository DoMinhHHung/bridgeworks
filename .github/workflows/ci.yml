name: CI

on:
  push:
    branches:
      - main
      - feat/identity-clerk-webhook-sync
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure local environment
        run: cp .env.example .env

      - name: Validate repository
        run: make repo-check

      - name: Verify generated sqlc code
        run: make identity-sqlc-check

      - name: Verify locked migration is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --exit-code origin/main HEAD -- \
            service/identity-service/migrations/000001_create_app_users.sql

  apisix:
    name: APISIX, PostgreSQL, and Clerk webhook integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Configure local environment
        run: cp .env.example .env

      - name: Verify gateway independently
        run: |
          docker compose down --remove-orphans --volumes
          make gateway-up
          curl --retry 30 --retry-all-errors --retry-delay 2 \
            --fail --show-error --silent \
            --output /dev/null \
            http://127.0.0.1:9080/healthz
          curl --fail --show-error --silent \
            http://127.0.0.1:9080/healthz

      - name: Verify migrations
        shell: bash
        run: |
          set -euo pipefail

          docker compose up -d identity-postgres
          docker compose run --name bridgeworks-ci-identity-migrate identity-migrate up
          migration_exit_code="$(docker inspect --format '{{.State.ExitCode}}' bridgeworks-ci-identity-migrate)"
          test "${migration_exit_code}" = "0"
          docker rm bridgeworks-ci-identity-migrate

          docker compose run --rm identity-migrate up

          version_output="$(docker compose run --rm identity-migrate version)"
          printf '%s\n' "${version_output}"
          grep --quiet '"version":1' <<< "${version_output}"

          docker compose run --rm identity-migrate status

          postgres_id="$(docker compose ps -q identity-postgres)"
          test "$(docker inspect --format '{{.State.Health.Status}}' "${postgres_id}")" = "healthy"

          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_USER=//p')"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_DB=//p')"
          test -n "${postgres_user}"
          test -n "${postgres_db}"

          docker compose exec -T identity-postgres psql \
            --username "${postgres_user}" \
            --dbname "${postgres_db}" \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --command "
              select to_regclass('app.goose_db_version') is not null;
              select to_regclass('app.app_users') is not null;
              select to_regclass('app.clerk_webhook_events') is not null;
              select exists (
                select 1
                from pg_extension
                where extname = 'citext'
              );
            " | grep --count ' t' | grep --quiet '^4$'

      - name: Build and start full stack
        run: make stack-up

      - name: Inspect full stack
        shell: bash
        run: |
          set -euo pipefail
          docker compose ps
          for service in identity-service identity-postgres; do
            container_id="$(docker compose ps -q "${service}")"
            port_bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "${container_id}")"
            case "${port_bindings}" in
              null|'{}') ;;
              *)
                echo "${service} must not publish host ports: ${port_bindings}" >&2
                exit 1
                ;;
            esac
          done

      - name: Test APISIX and identity-service
        run: make gateway-smoke

      - name: Verify healthy routes
        shell: bash
        run: |
          set -euo pipefail

          live_response="$(curl --fail --show-error --silent -i \
            -H 'X-Request-Id: postgres-live-check' \
            http://127.0.0.1:9080/api/v1/identity/health/live)"
          printf '%s\n' "${live_response}"
          grep --quiet 'HTTP/1.1 200' <<< "${live_response}"
          grep --quiet --ignore-case '^X-Request-Id: postgres-live-check' \
            <<< "${live_response//$'\r'/}"

          ready_response="$(curl --fail --show-error --silent -i \
            -H 'X-Request-Id: postgres-ready-check' \
            http://127.0.0.1:9080/api/v1/identity/health/ready)"
          printf '%s\n' "${ready_response}"
          grep --quiet 'HTTP/1.1 200' <<< "${ready_response}"
          grep --quiet --ignore-case '^X-Request-Id: postgres-ready-check' \
            <<< "${ready_response//$'\r'/}"

      - name: Verify Clerk webhook synchronization
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a

          work="${RUNNER_TEMP}/clerk-webhook"
          mkdir -p "${work}"
          webhook_url='http://127.0.0.1:9080/api/v1/identity/webhooks/clerk'

          postgres_id="$(docker compose ps -q identity-postgres)"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_USER=//p')"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_DB=//p')"

          psql_value() {
            docker compose exec -T identity-postgres psql \
              --username "${postgres_user}" \
              --dbname "${postgres_db}" \
              --set ON_ERROR_STOP=1 \
              --tuples-only \
              --no-align \
              --field-separator '|' \
              --command "$1" | sed '/^[[:space:]]*$/d'
          }

          send_signed() {
            local event_id="$1"
            local payload_file="$2"
            local body_output="$3"
            local request_id="$4"
            (
              cd service/identity-service
              go run ../../../.github/scripts/clerk-webhook-client.go \
                -url "${webhook_url}" \
                -secret "${CLERK_WEBHOOK_SIGNING_SECRET}" \
                -event-id "${event_id}" \
                -payload-file "${payload_file}" \
                -body-output "${body_output}" \
                -request-id "${request_id}"
            )
          }

          cat > "${work}/invalid.json" <<'JSON'
          {"type":"user.created","timestamp":1785744000000,"data":{"id":"user_ci_invalid","primary_email_address_id":"email_invalid","email_addresses":[{"id":"email_invalid","email_address":"invalid-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          invalid_body="${work}/invalid-response.json"
          invalid_headers="${work}/invalid-response.headers"
          invalid_status="$(curl --show-error --silent \
            --output "${invalid_body}" \
            --dump-header "${invalid_headers}" \
            --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'X-Request-Id: invalid-webhook-ci' \
            -H 'svix-id: msg_invalid' \
            -H "svix-timestamp: $(date +%s)" \
            -H 'svix-signature: v1,invalid-signature-ci' \
            --data-binary "@${work}/invalid.json" \
            "${webhook_url}")"
          test "${invalid_status}" = "400"
          grep --quiet --ignore-case '^X-Request-Id: invalid-webhook-ci' "${invalid_headers}"
          grep --quiet '"code":"invalid_webhook"' "${invalid_body}"
          test "$(psql_value 'select count(*) from app.app_users')" = "0"
          test "$(psql_value 'select count(*) from app.clerk_webhook_events')" = "0"

          cat > "${work}/create.json" <<'JSON'
          {"type":"user.created","timestamp":1785744000000,"data":{"id":"user_ci_primary","primary_email_address_id":"email_primary","email_addresses":[{"id":"email_other","email_address":"first-ci@example.test","verification":{"status":"verified"}},{"id":"email_primary","email_address":"verified-primary-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          create_result="$(send_signed msg_create "${work}/create.json" "${work}/create-response" create-webhook-ci)"
          test "${create_result}" = "204|create-webhook-ci"
          test ! -s "${work}/create-response"
          test "$(psql_value "select count(*) from app.app_users where clerk_user_id = 'user_ci_primary'")" = "1"
          test "$(psql_value "select count(*) from app.clerk_webhook_events where event_id = 'msg_create'")" = "1"
          test "$(psql_value "select substring(id::text from 15 for 1) from app.app_users where clerk_user_id = 'user_ci_primary'")" = "7"
          test "$(psql_value "select id_user ~ '^bw[0-9]{12}$' from app.app_users where clerk_user_id = 'user_ci_primary'")" = "t"
          test "$(psql_value "select status from app.app_users where clerk_user_id = 'user_ci_primary'")" = "active"
          test "$(psql_value "select primary_email::text from app.app_users where clerk_user_id = 'user_ci_primary'")" = "verified-primary-ci@example.test"

          original_row="$(psql_value "select id::text, id_user, created_at::text from app.app_users where clerk_user_id = 'user_ci_primary'")"
          duplicate_result="$(send_signed msg_create "${work}/create.json" "${work}/duplicate-response" duplicate-webhook-ci)"
          test "${duplicate_result}" = "204|duplicate-webhook-ci"
          test "$(psql_value "select count(*) from app.clerk_webhook_events where event_id = 'msg_create'")" = "1"
          test "$(psql_value "select count(*) from app.app_users where clerk_user_id = 'user_ci_primary'")" = "1"
          test "$(psql_value "select id::text, id_user, created_at::text from app.app_users where clerk_user_id = 'user_ci_primary'")" = "${original_row}"

          cat > "${work}/update.json" <<'JSON'
          {"type":"user.updated","timestamp":1785744001000,"data":{"id":"user_ci_primary","primary_email_address_id":"email_updated","email_addresses":[{"id":"email_updated","email_address":"updated-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          test "$(send_signed msg_update "${work}/update.json" "${work}/update-response" update-webhook-ci)" = "204|update-webhook-ci"
          test "$(psql_value "select primary_email::text from app.app_users where clerk_user_id = 'user_ci_primary'")" = "updated-ci@example.test"
          test "$(psql_value "select id::text, id_user from app.app_users where clerk_user_id = 'user_ci_primary'")" = "$(cut -d'|' -f1-2 <<< "${original_row}")"

          psql_value "update app.app_users set status = 'disabled' where clerk_user_id = 'user_ci_primary' returning status" | grep --quiet '^disabled$'
          cat > "${work}/disabled-update.json" <<'JSON'
          {"type":"user.updated","timestamp":1785744002000,"data":{"id":"user_ci_primary","primary_email_address_id":"email_disabled","email_addresses":[{"id":"email_disabled","email_address":"disabled-update-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          test "$(send_signed msg_disabled_update "${work}/disabled-update.json" "${work}/disabled-update-response" disabled-webhook-ci)" = "204|disabled-webhook-ci"
          test "$(psql_value "select status, primary_email::text from app.app_users where clerk_user_id = 'user_ci_primary'")" = "disabled|disabled-update-ci@example.test"

          cat > "${work}/delete.json" <<'JSON'
          {"type":"user.deleted","timestamp":1785744003000,"data":{"id":"user_ci_primary"}}
          JSON
          test "$(send_signed msg_delete "${work}/delete.json" "${work}/delete-response" delete-webhook-ci)" = "204|delete-webhook-ci"
          test "$(psql_value "select status, primary_email is null from app.app_users where clerk_user_id = 'user_ci_primary'")" = "deleted|t"
          test "$(psql_value "select id::text, id_user from app.app_users where clerk_user_id = 'user_ci_primary'")" = "$(cut -d'|' -f1-2 <<< "${original_row}")"

          cat > "${work}/stale-update.json" <<'JSON'
          {"type":"user.updated","timestamp":1785744002500,"data":{"id":"user_ci_primary","primary_email_address_id":"email_stale","email_addresses":[{"id":"email_stale","email_address":"stale-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          test "$(send_signed msg_stale_update "${work}/stale-update.json" "${work}/stale-response" stale-webhook-ci)" = "204|stale-webhook-ci"
          test "$(psql_value "select status, primary_email is null from app.app_users where clerk_user_id = 'user_ci_primary'")" = "deleted|t"
          test "$(psql_value "select count(*) from app.clerk_webhook_events where event_id = 'msg_stale_update'")" = "1"

          cat > "${work}/unknown-delete.json" <<'JSON'
          {"type":"user.deleted","timestamp":1785744004000,"data":{"id":"user_ci_tombstone"}}
          JSON
          test "$(send_signed msg_unknown_delete "${work}/unknown-delete.json" "${work}/unknown-delete-response" tombstone-webhook-ci)" = "204|tombstone-webhook-ci"
          test "$(psql_value "select status, primary_email is null, substring(id::text from 15 for 1), id_user ~ '^bw[0-9]{12}$' from app.app_users where clerk_user_id = 'user_ci_tombstone'")" = "deleted|t|7|t"

          cat > "${work}/outage.json" <<'JSON'
          {"type":"user.created","timestamp":1785744005000,"data":{"id":"user_ci_outage","primary_email_address_id":"email_outage","email_addresses":[{"id":"email_outage","email_address":"outage-ci@example.test","verification":{"status":"verified"}}]}}
          JSON
          identity_before="$(docker compose ps -q identity-service)"
          docker compose stop identity-postgres
          outage_result="$(send_signed msg_outage "${work}/outage.json" "${work}/outage-response" outage-webhook-ci)"
          test "${outage_result}" = "503|outage-webhook-ci"
          grep --quiet '"code":"service_unavailable"' "${work}/outage-response"
          grep --quiet '"message":"service temporarily unavailable"' "${work}/outage-response"

          docker compose start identity-postgres
          make gateway-smoke
          test "$(docker compose ps -q identity-service)" = "${identity_before}"
          test "$(send_signed msg_outage "${work}/outage.json" "${work}/outage-retry-response" outage-retry-webhook-ci)" = "204|outage-retry-webhook-ci"
          test "$(psql_value "select count(*) from app.app_users where clerk_user_id = 'user_ci_outage'")" = "1"
          test "$(psql_value "select count(*) from app.clerk_webhook_events where event_id = 'msg_outage'")" = "1"

          service_logs="$(docker compose logs --no-color identity-service)"
          forbidden_pattern='whsec_|verified-primary-ci@example.test|first-ci@example.test|updated-ci@example.test|disabled-update-ci@example.test|stale-ci@example.test|outage-ci@example.test|user_ci_|svix-signature|invalid-signature-ci|postgres://|bridgeworks_identity_local|identity-postgres|pgx|connection refused'
          if grep --extended-regexp --ignore-case --quiet "${forbidden_pattern}" <<< "${service_logs}"; then
            echo "identity-service logs leaked webhook or database details" >&2
            printf '%s\n' "${service_logs}" >&2
            exit 1
          fi
          if grep --recursive --extended-regexp --ignore-case --quiet "${forbidden_pattern}" "${work}"/*response*; then
            echo "webhook response leaked sensitive details" >&2
            exit 1
          fi

      - name: Verify dependency outage health semantics
        shell: bash
        run: |
          set -euo pipefail
          docker compose stop identity-postgres

          live_response="$(curl --fail --show-error --silent -i \
            -H 'X-Request-Id: database-down-live' \
            http://127.0.0.1:9080/api/v1/identity/health/live)"
          printf '%s\n' "${live_response}"
          grep --quiet 'HTTP/1.1 200' <<< "${live_response}"
          grep --quiet --ignore-case '^X-Request-Id: database-down-live' <<< "${live_response//$'\r'/}"

          ready_body="$(mktemp)"
          ready_headers="$(mktemp)"
          status_code="$(curl --show-error --silent \
            --output "${ready_body}" \
            --dump-header "${ready_headers}" \
            --write-out '%{http_code}' \
            -H 'X-Request-Id: database-down-ready' \
            http://127.0.0.1:9080/api/v1/identity/health/ready)"
          cat "${ready_headers}"
          cat "${ready_body}"
          test "${status_code}" = "503"
          grep --quiet --ignore-case '^X-Request-Id: database-down-ready' "${ready_headers}"
          grep --quiet '"code":"service_unavailable"' "${ready_body}"

          docker compose start identity-postgres
          make gateway-smoke

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service identity-postgres identity-migrate

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes

  go-services:
    name: Go services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect service modules
        id: modules
        shell: bash
        run: |
          if compgen -G "service/*/go.mod" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Go service modules found; skipping Go checks."
          fi

      - name: Set up Go
        if: steps.modules.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        if: steps.modules.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Validate Go services
        if: steps.modules.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for module_file in service/*/go.mod; do
            service_dir="$(dirname "${module_file}")"
            echo "::group::${service_dir}"
            unformatted="$(find "${service_dir}" -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
            if [[ -n "${unformatted}" ]]; then
              echo "Files require gofmt:"
              echo "${unformatted}"
              exit 1
            fi
            (
              cd "${service_dir}"
              go mod tidy -diff
              go vet ./...
              go test -race -coverprofile=coverage.out ./...
              golangci-lint run ./...
            )
            echo "::endgroup::"
          done
