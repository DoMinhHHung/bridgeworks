name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository
        run: make repo-check

  apisix:
    name: APISIX smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify gateway independently
        run: |
          docker compose down --remove-orphans
          docker compose up -d apisix
          curl --retry 30 --retry-all-errors --retry-delay 2 \
            --fail --show-error --silent \
            http://127.0.0.1:9080/healthz

      - name: Build and start full stack
        run: docker compose up -d --build

      - name: Inspect full stack
        run: |
          docker compose ps
          published_port="$(docker compose port identity-service 8080 2>/dev/null || true)"
          if [[ -n "${published_port}" ]]; then
            echo "identity-service must not publish port 8080: ${published_port}" >&2
            exit 1
          fi

      - name: Test APISIX and identity-service
        run: make gateway-smoke

      - name: Curl identity health routes
        shell: bash
        run: |
          set -euo pipefail

          live_response="$(curl --fail --show-error --silent -i \
            -H 'X-Request-Id: verify-live-request-id' \
            http://127.0.0.1:9080/api/v1/identity/health/live)"
          printf '%s\n' "${live_response}"
          grep --quiet --ignore-case '^X-Request-Id: verify-live-request-id' \
            <<< "${live_response//$'\r'/}"

          ready_response="$(curl --fail --show-error --silent -i \
            -H 'X-Request-Id: verify-ready-request-id' \
            http://127.0.0.1:9080/api/v1/identity/health/ready)"
          printf '%s\n' "${ready_response}"
          grep --quiet --ignore-case '^X-Request-Id: verify-ready-request-id' \
            <<< "${ready_response//$'\r'/}"

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans

  go-services:
    name: Go services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect service modules
        id: modules
        shell: bash
        run: |
          if compgen -G "service/*/go.mod" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Go service modules found; skipping Go checks."
          fi

      - name: Set up Go
        if: steps.modules.outputs.found == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        if: steps.modules.outputs.found == 'true'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Validate Go services
        if: steps.modules.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for module_file in service/*/go.mod; do
            service_dir="$(dirname "${module_file}")"
            echo "::group::${service_dir}"

            unformatted="$(find "${service_dir}" -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
            if [[ -n "${unformatted}" ]]; then
              echo "Files require gofmt:"
              echo "${unformatted}"
              exit 1
            fi

            (
              cd "${service_dir}"
              go mod tidy -diff
              go vet ./...
              go test -race -coverprofile=coverage.out ./...
              golangci-lint run ./...
            )

            echo "::endgroup::"
          done
