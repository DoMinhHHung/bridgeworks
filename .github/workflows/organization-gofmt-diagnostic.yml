name: Organization Gofmt Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  gofmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Print Go 1.26 gofmt diff
        shell: bash
        run: |
          set -euo pipefail
          gofmt -d service/organization-service/internal/httpapi/onboarding.go || true
          gofmt -d service/organization-service/internal/organizationonboarding/service_test.go || true
          test -z "$(gofmt -l service/organization-service/internal/httpapi/onboarding.go service/organization-service/internal/organizationonboarding/service_test.go)"
