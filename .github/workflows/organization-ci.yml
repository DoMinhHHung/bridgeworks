name: Organization CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  organization-validation:
    name: Organization repository, Go, and sqlc validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify clean checkout and CI base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --short)"
          base_sha="$(bash .github/scripts/ci-base-sha.sh)"
          git merge-base --is-ancestor "${base_sha}" HEAD

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          install-only: true

      - name: Configure local environment
        run: cp .env.example .env

      - name: Verify repository and generated sqlc sources
        run: |
          make repo-check
          make identity-sqlc-check
          make organization-sqlc-check

      - name: Verify locked Identity and Organization baseline migrations
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(bash .github/scripts/ci-base-sha.sh)"
          git diff --exit-code "${base_sha}...HEAD" -- \
            service/identity-service/migrations/000001_create_app_users.sql \
            service/identity-service/migrations/000002_add_platform_access.sql \
            service/organization-service/migrations/000001_create_organization_foundation.sql \
            service/organization-service/migrations/000002_complete_organization_domain.sql \
            service/organization-service/migrations/000003_add_owner_bootstrap_state.sql \
            service/organization-service/migrations/000004_add_membership_administration.sql \
            service/organization-service/migrations/000005_add_organization_audit.sql
          test "$(find service/identity-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "2"
          test "$(find service/organization-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "5"

      - name: Verify Organization application boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "ProcessEvent" service/organization-service/internal
          ! grep -R "repository.ProcessEvent" service/organization-service/internal
          ! grep -R "organizationid.Generator" service/organization-service/internal/store
          ! grep -R "service/identity-service/internal" service/organization-service
          grep --quiet "SAVEPOINT membership_insert" service/organization-service/internal/store/repository.go
          grep --quiet "ROLLBACK TO SAVEPOINT membership_insert" service/organization-service/internal/store/repository.go
          grep --quiet "memberships_clerk_membership_id_uq" service/organization-service/internal/organizationsync/unit_of_work.go
          grep --quiet "memberships_active_organization_user_uq" service/organization-service/internal/organizationsync/unit_of_work.go
          grep --quiet "validateMembershipOwnership" service/organization-service/internal/organizationsync/service.go
          grep --quiet "inconsistent Clerk membership projection" service/organization-service/internal/organizationsync/service.go
          grep --quiet "CreatedBy" service/organization-service/internal/organizationsync/event.go
          grep --quiet "OwnerBootstrapEligible" service/organization-service/internal/organizationsync/service.go
          grep --quiet "bootstrapInitialOwner" service/organization-service/internal/organizationsync/service.go
          grep --quiet "bridgeworks_invitation_id" service/organization-service/internal/organizationsync/event.go
          grep --quiet "AcquireOrganizationAdvisoryLockByID" service/organization-service/internal/store/queries/membership_administration.sql
          grep --quiet "CountEffectiveOwners" service/organization-service/internal/store/queries/membership_administration.sql
          grep --quiet "membership_removal_intents" service/organization-service/internal/store/queries/memberships.sql
          grep --quiet "LockOrganizationByID" service/organization-service/internal/store/queries/organizations.sql
          grep --quiet "FOR UPDATE" service/organization-service/internal/store/queries/organizations.sql
          grep --quiet "UpdateOrganizationProductProfile" service/organization-service/internal/store/queries/organizations.sql
          grep --quiet "UpdateOrganizationVerificationStatus" service/organization-service/internal/store/queries/organizations.sql
          grep --quiet "UpdateOrganizationBusinessEmailVerification" service/organization-service/internal/store/queries/organizations.sql
          projection_sql="$(awk '
            /-- name: UpdateOrganizationProjection / {capture=1}
            capture {print}
            capture && /;$/ {exit}
          ' service/organization-service/internal/store/queries/organizations.sql)"
          grep --quiet 'SET name = \$2' <<< "${projection_sql}"
          grep --quiet 'slug = \$3' <<< "${projection_sql}"
          grep --quiet 'status = \$4' <<< "${projection_sql}"
          ! grep -E 'legal_name|website|country|company_type|verification_status|trust_status|application_role|business_email' <<< "${projection_sql}"
          ! grep -R --line-number --fixed-strings 'POST /api/v1/organizations' service/organization-service/internal
          ! grep -R --line-number --ignore-case 'clerk.*secret' service/organization-service/internal/organizationonboarding
          ! grep -R --line-number -E 'X-Platform-Admin|admin.*allowlist' service/organization-service/internal
          ! grep -R --line-number --fixed-strings 'platform_admin' \
            service/organization-service/internal/authorization \
            service/organization-service/internal/currentorganization \
            service/organization-service/internal/membershipadmin
          grep --quiet 'ResolvePlatformAccess' service/organization-service/internal/identityclient/platform_access.go
          grep --quiet 'PermissionOrganizationVerificationReview' service/organization-service/internal/platformauthorization/service.go
          grep --quiet 'organization.audit.read' service/organization-service/migrations/000005_add_organization_audit.sql
          ! grep -R --line-number --fixed-strings '/internal/v1/platform-access/me' gateway/apisix/conf/apisix.yaml gateway/apisix/conf/apisix.cloud-run.yaml
          ! grep -R --line-number --fixed-strings 'ORGANIZATION_MAINTENANCE_DATABASE_URL' compose.yaml

      - name: Validate Organization Go module
        shell: bash
        run: |
          set -euo pipefail
          cd service/organization-service
          unformatted="$(find . -name '*.go' -type f -print0 | xargs -0 -r gofmt -l)"
          if [[ -n "${unformatted}" ]]; then
            printf 'Unformatted Go files:\n%s\n' "${unformatted}" >&2
            exit 1
          fi
          go mod tidy -diff
          go vet ./...
          go test -race -coverprofile=coverage.out ./...
          golangci-lint run ./...
          go tool cover -func=coverage.out | tee coverage-summary.txt

      - name: Verify workflow trigger policy
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/organization-sync''-authorization'
          ! grep -R "${branch}" .github/workflows

  organization-integration:
    name: Organization PostgreSQL, Clerk sync, Identity dependency, and authorization integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Configure environment and ephemeral Clerk key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          auth_work="${RUNNER_TEMP}/clerk-auth"
          mkdir -p "${auth_work}"
          (
            cd service/organization-service
            go run ../../.github/scripts/clerk-session-token.go \
              -action generate \
              -private-key "${auth_work}/private.pem" \
              -public-key "${auth_work}/public.key"
          )
          public_key="$(cat "${auth_work}/public.key")"
          test -n "${public_key}"
          sed -i "s|^CLERK_JWT_KEY=.*$|CLERK_JWT_KEY=${public_key}|" .env
          test ! -e service/organization-service/private.pem
          test ! -e service/identity-service/private.pem

      - name: Verify standalone APISIX
        shell: bash
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose down --remove-orphans --volumes
          make gateway-up
          curl --retry 30 --retry-all-errors --retry-delay 2 \
            --fail --show-error --silent \
            http://127.0.0.1:9080/healthz

      - name: Verify Organization migrations and seeds
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d organization-postgres
          docker compose build organization-migrate
          if ! first="$(docker compose run --rm organization-migrate up)"; then
            printf '%s\n' "${first}"
            exit 1
          fi
          printf '%s\n' "${first}"
          grep --quiet '"count":5' <<< "${first}"
          second="$(docker compose run --rm organization-migrate up)"
          printf '%s\n' "${second}"
          grep --quiet '"count":0' <<< "${second}"
          version="$(docker compose run --rm organization-migrate version)"
          printf '%s\n' "${version}"
          grep --quiet '"version":5' <<< "${version}"
          status="$(docker compose run --rm organization-migrate status)"
          printf '%s\n' "${status}"
          grep --quiet '000001_create_organization_foundation.sql' <<< "${status}"
          grep --quiet '000002_complete_organization_domain.sql' <<< "${status}"
          grep --quiet '000003_add_owner_bootstrap_state.sql' <<< "${status}"
          grep --quiet '000004_add_membership_administration.sql' <<< "${status}"
          grep --quiet '000005_add_organization_audit.sql' <<< "${status}"
          test "$(grep -c '"state":"applied"' <<< "${status}")" -ge 5
          postgres_id="$(docker compose ps -q organization-postgres)"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_USER=//p')"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_DB=//p')"
          docker compose exec -T organization-postgres psql \
            --username "${postgres_user}" \
            --dbname "${postgres_db}" \
            --set ON_ERROR_STOP=1 \
            --tuples-only \
            --command "
              select to_regclass('organization.goose_db_version') is not null;
              select to_regclass('organization.organizations') is not null;
              select to_regclass('organization.memberships') is not null;
              select to_regclass('organization.clerk_webhook_events') is not null;
              select to_regclass('organization.membership_invitation_intents') is not null;
              select to_regclass('organization.membership_removal_intents') is not null;
              select to_regclass('organization.audit_events') is not null;
              select count(*) = 5 from organization.roles;
              select count(*) = 8 from organization.permissions;
              select count(*) = 19 from organization.role_permissions;
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='clerk_created_by_user_id'
              );
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='owner_bootstrapped'
              );
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='owner_bootstrap_eligible'
              );
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='business_email_domain'
              );
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='business_email_verified_at'
              );
              select exists (
                select 1 from information_schema.columns
                where table_schema='organization' and table_name='organizations'
                  and column_name='business_email_verified_by_user_id'
              );
            " | grep --count ' t' | grep --quiet '^16$'

      - name: Verify v1 through v5 Organization migrations and concurrency
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          postgres_id="$(docker compose ps -q organization-postgres)"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_USER=//p')"
          network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "${postgres_id}" | head -n 1)"
          test -n "${postgres_user}"
          test -n "${network}"
          test_database='bridgeworks_organization_migration_test'
          docker compose exec -T organization-postgres psql \
            --username "${postgres_user}" \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "drop database if exists ${test_database} with (force)"
          docker compose exec -T organization-postgres psql \
            --username "${postgres_user}" \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "create database ${test_database}"
          migration_test_url="postgres://${ORGANIZATION_POSTGRES_USER}:${ORGANIZATION_POSTGRES_PASSWORD}@organization-postgres:5432/${test_database}?sslmode=disable"
          docker run --rm \
            --network "${network}" \
            --volume "${PWD}:/src" \
            --workdir /src/service/organization-service \
            --env "ORGANIZATION_MIGRATION_TEST_DATABASE_URL=${migration_test_url}" \
            golang:1.26.5-bookworm \
            go test -race -run '^(TestDomainMigrationUpgradesExistingRowsSafely|TestOnboardingMigrationPreservesExistingAuthorization|TestMembershipAdministrationMigrationPreservesAuthorizationAndAddsPrivateState|TestOrganizationAuditMigrationPreservesV4StateAndAddsBoundedAuditAuthority|TestPlatformReviewConcurrencyAndAuditAtomicity)$' ./migrations
          unset migration_test_url
          docker compose exec -T organization-postgres psql \
            --username "${postgres_user}" \
            --dbname postgres \
            --set ON_ERROR_STOP=1 \
            --command "drop database if exists ${test_database} with (force)"

      - name: Prepare migrated legacy owner-bootstrap webhook fixture
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          postgres_id="$(docker compose ps -q organization-postgres)"
          network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "${postgres_id}" | head -n 1)"
          test -n "${network}"
          fixture_url="postgres://${ORGANIZATION_POSTGRES_USER}:${ORGANIZATION_POSTGRES_PASSWORD}@organization-postgres:5432/${ORGANIZATION_POSTGRES_DB}?sslmode=disable"
          docker run --rm \
            --network "${network}" \
            --volume "${PWD}:/src" \
            --workdir /src/service/organization-service \
            --env "ORGANIZATION_LEGACY_WEBHOOK_TEST_DATABASE_URL=${fixture_url}" \
            golang:1.26.5-bookworm \
            go test -race -run '^TestPrepareLegacyOwnerBootstrapWebhookFixture$' ./migrations
          unset fixture_url

      - name: Start complete private stack
        run: make stack-up

      - name: Smoke test through APISIX
        run: make gateway-smoke organization-smoke

      - name: Verify Organization synchronization and authorization
        shell: bash
        run: bash .github/scripts/verify-organization-integration.sh

      - name: Verify Organization onboarding ownership and webhook reconciliation
        shell: bash
        run: bash .github/scripts/verify-organization-onboarding.sh

      - name: Verify Organization production completion
        shell: bash
        run: bash .github/scripts/verify-organization-production-completion.sh

      - name: Verify membership conflict and concurrency regressions
        shell: bash
        run: bash .github/scripts/verify-organization-conflicts.sh

      - name: Verify membership projection ownership invariant
        shell: bash
        run: bash .github/scripts/verify-organization-membership-ownership.sh

      - name: Verify unrelated PostgreSQL unique violation
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a
          organization_service_id="$(docker compose ps -q organization-service)"
          network="$(docker inspect --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "${organization_service_id}" | head -n 1)"
          test -n "${network}"
          docker run --rm \
            --network "${network}" \
            --volume "${PWD}:/src" \
            --workdir /src/service/organization-service \
            --env "ORGANIZATION_TEST_DATABASE_URL=${ORGANIZATION_DATABASE_URL}" \
            golang:1.26.5-bookworm \
            go test -race -run '^TestPostgresUnrelatedUniqueViolationRollsBackInbox$' ./internal/organizationsync

      - name: Verify private port isolation
        shell: bash
        run: |
          set -euo pipefail
          for service in identity-service organization-service identity-postgres organization-postgres; do
            container_id="$(docker compose ps -q "${service}")"
            test -n "${container_id}"
            port_bindings="$(docker inspect --format '{{json .HostConfig.PortBindings}}' "${container_id}")"
            case "${port_bindings}" in
              null|'{}') ;;
              *)
                echo "${service} must not publish host ports" >&2
                exit 1
                ;;
            esac
          done

      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service identity-postgres organization-service organization-postgres identity-migrate organization-migrate

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes