name: Normalize Organization Sources

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-organization-sources
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/organization-sync-authorization
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Regenerate and commit authoritative sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f service/organization-service/go.sum
          (
            cd service/organization-service
            go mod tidy
          )
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src/service/organization-service \
            sqlc/sqlc:1.31.1 generate
          sed -i 's/organization_membership\./organizationMembership./g' .github/scripts/verify-organization-integration.sh
          python3 -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(encoding="utf-8"); section="\n\n---\n\n## Runtime services\n\nBridgeWorks runs Identity Service and Organization Service as independent Go modules. Both upstream ports remain private on the Docker network; APISIX on `http://127.0.0.1:9080` is the only host-published HTTP entry point.\n\nStart the stack with `cp .env.example .env` and `make stack-up`. Organization public paths are `/api/v1/organizations/health/live`, `/api/v1/organizations/health/ready`, `/api/v1/organizations/webhooks/clerk`, `/api/v1/organizations/current`, and `/api/v1/organizations/current/membership`. Run `make organization-smoke` for the APISIX health smoke test. Service ownership, migration, Clerk setup, ordering, and authorization semantics are documented in `service/organization-service/README.md`.\n"; p.write_text(s if "\n## Runtime services\n" in s else s+section, encoding="utf-8")'
          rm -f .github/workflows/organization-codegen.yml
          rm -f .github/workflows/organization-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "chore(organization): normalize generated sources"
          git push origin HEAD:feat/organization-sync-authorization
