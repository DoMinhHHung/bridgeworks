name: Organization CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: organization-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize-generated-sources:
    name: Normalize Organization generated sources
    if: ${{ github.event_name == 'pull_request' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/organization-sync-authorization
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Normalize and commit
        shell: bash
        run: |
          set -euo pipefail
          rm service/organization-service/go.sum
          (
            cd service/organization-service
            go mod tidy
          )
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src/service/organization-service \
            sqlc/sqlc:1.31.1 generate
          sed -i 's/organization_membership\./organizationMembership./g' .github/scripts/verify-organization-integration.sh
          if ! grep -q '^## Runtime services$' README.md; then
            cat >> README.md <<'EOF'

---

## Runtime services

BridgeWorks currently runs Identity Service and Organization Service as independent Go modules. Both upstream ports remain private on the Docker network; APISIX on `http://127.0.0.1:9080` is the only host-published HTTP entry point.

Start the complete stack with:

```bash
cp .env.example .env
make stack-up
```

Organization public paths are:

- `GET /api/v1/organizations/health/live`
- `GET /api/v1/organizations/health/ready`
- `POST /api/v1/organizations/webhooks/clerk`
- `GET /api/v1/organizations/current`
- `GET /api/v1/organizations/current/membership`

Use `make organization-smoke` for the APISIX health smoke test. Service-specific ownership, migration, Clerk setup, ordering, and authorization semantics are documented in `service/organization-service/README.md`.
EOF
          fi
          rm -f .github/workflows/organization-codegen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(organization): normalize generated sources"
          git push origin HEAD:feat/organization-sync-authorization

  organization-repository:
    name: Organization repository and sqlc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure local environment
        run: cp .env.example .env
      - name: Validate repository and generated SQL
        run: |
          make repo-check
          make identity-sqlc-check
          make organization-sqlc-check
      - name: Verify Identity migration remains locked
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --exit-code origin/main HEAD -- service/identity-service/migrations/000001_create_app_users.sql
          test "$(find service/identity-service/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" = "1"
      - name: Verify feature branch is not a push trigger
        shell: bash
        run: |
          ! grep -R "feat/organization-sync-authorization" .github/workflows

  organization-integration:
    name: Organization PostgreSQL, Clerk sync, Identity dependency, and authorization integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Configure local environment and ephemeral Clerk key
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          auth_work="${RUNNER_TEMP}/clerk-auth"
          mkdir -p "${auth_work}"
          (
            cd service/organization-service
            go run ../../.github/scripts/clerk-session-token.go \
              -action generate \
              -private-key "${auth_work}/private.pem" \
              -public-key "${auth_work}/public.key"
          )
          public_key="$(cat "${auth_work}/public.key")"
          test -n "${public_key}"
          sed -i "s|^CLERK_JWT_KEY=.*$|CLERK_JWT_KEY=${public_key}|" .env
          test ! -e service/organization-service/private.pem
          test ! -e service/identity-service/private.pem
      - name: Verify standalone gateway
        shell: bash
        run: |
          set -euo pipefail
          docker compose down --remove-orphans --volumes
          make gateway-up
          curl --retry 30 --retry-all-errors --retry-delay 2 --fail --show-error --silent http://127.0.0.1:9080/healthz
      - name: Verify Organization migration and PostgreSQL constraints
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d organization-postgres
          first="$(docker compose run --rm organization-migrate up)"
          printf '%s\n' "${first}"
          grep --quiet '"count":1' <<< "${first}"
          second="$(docker compose run --rm organization-migrate up)"
          printf '%s\n' "${second}"
          grep --quiet '"count":0' <<< "${second}"
          version="$(docker compose run --rm organization-migrate version)"
          printf '%s\n' "${version}"
          grep --quiet '"version":1' <<< "${version}"
          status="$(docker compose run --rm organization-migrate status)"
          printf '%s\n' "${status}"
          grep --quiet '000001_create_organization_foundation.sql' <<< "${status}"
          grep --quiet '"state":"applied"' <<< "${status}"
          postgres_id="$(docker compose ps -q organization-postgres)"
          postgres_user="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_USER=//p')"
          postgres_db="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "${postgres_id}" | sed -n 's/^POSTGRES_DB=//p')"
          docker compose exec -T organization-postgres psql --username "${postgres_user}" --dbname "${postgres_db}" --set ON_ERROR_STOP=1 --tuples-only --command "
            select to_regclass('organization.organizations') is not null;
            select to_regclass('organization.memberships') is not null;
            select to_regclass('organization.clerk_webhook_events') is not null;
            select count(*) = 2 from organization.roles;
            select count(*) = 4 from organization.permissions;
            select count(*) = 5 from organization.role_permissions;
          " | grep --count ' t' | grep --quiet '^6$'
      - name: Build and start complete private stack
        run: make stack-up
      - name: Smoke test both services through APISIX
        run: make gateway-smoke organization-smoke
      - name: Verify Organization synchronization and authorization
        shell: bash
        run: bash .github/scripts/verify-organization-integration.sh
      - name: Print logs on failure
        if: failure()
        run: docker compose logs --no-color apisix identity-service identity-postgres organization-service organization-postgres identity-migrate organization-migrate
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans --volumes
