name: Normalize Organization Generated Sources

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: normalize-organization-generated-sources
  cancel-in-progress: false

jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/organization-sync-authorization
          fetch-depth: 0
      - name: Normalize module and sqlc output
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false
      - name: Generate and commit authoritative files
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's|TIyPZe4MgqvfeYDBFedMoGGpEw/LqOeaOT+nhXU+yHo=|TIyPZe4MgqvfeYDBFedMoGGpEw/LqOeaOT+nhxU+yHo=|' service/organization-service/go.sum
          (
            cd service/organization-service
            go mod tidy
          )
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/src" \
            --workdir /src/service/organization-service \
            sqlc/sqlc:1.31.1 generate
          rm -rf .github/payloads/organization
          rm -f .github/workflows/apply-organization-payload.yml
          rm -f .github/workflows/organization-codegen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "chore(organization): normalize generated sources"
          git push origin HEAD:feat/organization-sync-authorization
