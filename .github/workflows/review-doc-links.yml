name: Normalize review documentation links

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-links:
    if: github.event.pull_request.number == 7 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Add documentation links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          additions = {
              Path("README.md"): """

          ---

          ## Production operations

          Operational follow-up design is tracked in [Production Readiness Roadmap](docs/production-readiness-roadmap.md). Clerk verification-key rotations must follow the [Clerk JWT Key Rotation Runbook](docs/runbooks/clerk-jwt-key-rotation.md).
          """,
              Path("service/identity-service/README.md"): """

          ## Production operations

          Cross-service capacity, traffic protection, observability, cache, and retention work is tracked in the [production-readiness roadmap](../../docs/production-readiness-roadmap.md). Rotate the configured Clerk verification key with the [Clerk JWT key-rotation runbook](../../docs/runbooks/clerk-jwt-key-rotation.md).
          """,
              Path("service/organization-service/README.md"): """

          ## Production operations

          Cross-service capacity, traffic protection, observability, cache, and retention work is tracked in the [production-readiness roadmap](../../docs/production-readiness-roadmap.md). Rotate the configured Clerk verification key with the [Clerk JWT key-rotation runbook](../../docs/runbooks/clerk-jwt-key-rotation.md).
          """,
          }
          marker = "docs/production-readiness-roadmap.md"
          for path, addition in additions.items():
              current = path.read_text(encoding="utf-8")
              if marker not in current:
                  path.write_text(current.rstrip() + addition + "\n", encoding="utf-8")
          PY

      - name: Commit documentation links
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md service/identity-service/README.md service/organization-service/README.md
          git commit -m "docs: link production readiness guidance"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
