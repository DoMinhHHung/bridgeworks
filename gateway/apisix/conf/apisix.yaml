        expose_headers: "X-Request-Id,Retry-After,WWW-Authenticate"
        max_age: 600
        allow_credential: false
      proxy-rewrite:
        regex_uri: ["^/api/v1/organizations/current/members/(.*)/role$", "/organizations/current/members/$1/role"]
    upstream:
