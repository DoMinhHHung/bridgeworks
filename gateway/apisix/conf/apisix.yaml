routes:
  - id: bridgeworks-gateway-health
    name: bridgeworks-gateway-health
    uri: /healthz
    methods:
      - GET
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid
      mocking:
        response_status: 200
        content_type: application/json
        response_example: '{"status":"ok","component":"apisix","project":"bridgeworks"}'
        with_mock_header: true
    upstream:
      type: roundrobin
      nodes:
        "127.0.0.1:1": 1

  - id: bridgeworks-identity-health-live
    name: bridgeworks-identity-health-live
    uri: /api/v1/identity/health/live
    methods:
      - GET
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        uri: /health/live
    upstream:
      type: roundrobin
      nodes:
        "identity-service:8080": 1

  - id: bridgeworks-identity-health-ready
    name: bridgeworks-identity-health-ready
    uri: /api/v1/identity/health/ready
    methods:
      - GET
    plugins:
      request-id:
        header_name: X-Request-Id
        include_in_response: true
        algorithm: uuid
      proxy-rewrite:
        uri: /health/ready
    upstream:
      type: roundrobin
      nodes:
        "identity-service:8080": 1
#END
