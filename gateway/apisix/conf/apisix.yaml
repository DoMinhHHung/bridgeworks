routes:
  - id: bridgeworks-gateway-health
    name: bridgeworks-gateway-health
    uri: /healthz
    methods: [GET]
    plugins:
      request-id: { header_name: X-Request-Id, include_in_response: true, algorithm: uuid }
      mocking:
        response_status: 200
        content_type: application/json
        response_example: '{"status":"ok","component":"apisix","project":"bridgeworks"}'
        with_mock_header: true
    upstream:
      type: roundrobin
      nodes: { "127.0.0.1:1": 1 }

  - id: bridgeworks-identity-live
    name: bridgeworks-identity-live
    uri: /api/v1/identity/health/live
    methods: [GET]
    plugins:
      request-id: { header_name: X-Request-Id, include_in_response: true, algorithm: uuid }
      proxy-rewrite: { uri: /health/live }
    upstream:
      type: roundrobin
      timeout: { connect: 1, send: 2, read: 2 }
      nodes: { "identity-service:8080": 1 }

  - id: bridgeworks-identity-ready
    name: bridgeworks-identity-ready
    uri: /api/v1/identity/health/ready
    methods: [GET]
    plugins:
      request-id: { header_name: X-Request-Id, include_in_response: true, algorithm: uuid }
      proxy-rewrite: { uri: /health/ready }
    upstream:
      type: roundrobin
      timeout: { connect: 1, send: 2, read: 2 }
      nodes: { "identity-service:8080": 1 }

  - id: bridgeworks-identity-clerk-webhook
    name: bridgeworks-identity-clerk-webhook
    uri: /api/v1/identity/webhooks/clerk
    methods: [POST]
    plugins:
      request-id: { header_name: X-Request-Id, include_in_response: true, algorithm: uuid }
      proxy-rewrite: { uri: /webhooks/clerk }
    upstream:
      type: roundrobin
      timeout: { connect: 1, send: 10, read: 10 }
      nodes: { "identity-service:8080": 1 }

  - id: bridgeworks-identity-me
    name: bridgeworks-identity-me
    uri: /api/v1/me
    methods: [GET, OPTIONS]
    plugins:
      request-id: { header_name: X-Request-Id, include_in_response: true, algorithm: uuid }
      cors:
        allow_origins: "${{CLERK_AUTHORIZED_PARTIES}}"
        allow_methods: "GET,OPTIONS"
        allow_headers: "Authorization,Content-Type,X-Request-Id"
        expose_headers: "X-Request-Id,Retry-After"
        max_age: 600
        allow_credential: false
      proxy-rewrite: { uri: /me }
    upstream:
      type: roundrobin
      timeout: { connect: 1, send: 5, read: 5 }
      nodes: { "identity-service:8080": 1 }

